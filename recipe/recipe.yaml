context:
  version: "2.0.4"

package:
  name: libmcfp
  version: ${{ version }}

source:
  url: https://forge.hekkelman.net/maarten/mcfp/archive/v${{ version }}.tar.gz
  sha256: b1a714511b77e0c211ff99276e8658618997739a719cbd67e34df3067c68c74a
  patches:
    - ${{ "fix-config-name-char.patch" if win }}
    # - fix-config-category-last-option.patch

build:
  number: 0
  script:
    - if: unix
      then: |
        set -exo pipefail
        export CXXFLAGS="${CXXFLAGS} -D_LIBCPP_DISABLE_AVAILABILITY"
        cmake -S . -B build -G Ninja \
          ${CMAKE_ARGS} \
          -DBUILD_SHARED_LIBS=ON \
          -DBUILD_TESTING=ON
        cmake --build build --parallel ${CPU_COUNT}
        ctest -V --test-dir build
        cmake --install build --parallel ${CPU_COUNT}
    - if: win
      then: |
        @echo on
        set "PATH=%SRC_DIR%\build;%PATH%"
        @REM MSVC constexpr workaround
        sed -i -E "s/return .*isalnum.*;/return (c >= '0' && c <= '9') || (c >= 'A' && c <= 'Z') || (c >= 'a' && c <= 'z') || c == '_' || c == '-';/" "include/mcfp/mcfp.hpp"
        cmake -S . -B build -G Ninja ^
          %CMAKE_ARGS% ^
          -DBUILD_SHARED_LIBS=ON ^
          -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON ^
          -DBUILD_TESTING=ON ^
          || exit /b 1
        cmake --build build --parallel %CPU_COUNT% || exit /b 1
        ctest -V --test-dir build || exit /b 1
        cmake --install build --parallel %CPU_COUNT% || exit /b 1

requirements:
  build:
    - ${{ compiler("cxx") }}
    - ${{ stdlib("c") }}
    - ${{ "clang-tools" if osx }}
    - ${{ "m2-sed" if win }}
    - cmake
    - ninja
  host:
    - catch2
    - fast_float
  run_exports:
    - ${{ pin_subpackage("libmcfp", upper_bound="x") }}
  ignore_run_exports:
    from_package:
      - catch2

tests:
  - package_contents:
      include:
        - mcfp/mcfp.hpp
        - mcfp/options.hpp
        - mcfp/sections.hpp
        - mcfp/error.hpp
        - mcfp/charconv.hpp
        - mcfp/text.hpp
      lib:
        - mcfp

about:
  homepage: https://mhekkel.github.io/libmcfp
  repository: https://forge.hekkelman.net/maarten/mcfp.git
  documentation: https://mhekkel.github.io/libmcfp/api/library_root.html
  license: BSD-2-Clause AND MIT AND LicenseRef-CC0-1.0
  license_file: LICENSES/
  summary: "Library for parsing command line arguments and config files"
  description: |
    This library attempts to implement the POSIX.1-2017 standard for parsing arguments passed to an application.
    These arguments are delivered to the main function as the well known argc and argv parameters.
    This library allows you to parse the contents of these variables and then provides easy access to the information.
    The library also contains code to parse configuration files

extra:
  recipe-maintainers:
    - eunos-1128
